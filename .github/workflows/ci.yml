name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: broker_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d broker_cms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cms:cms@localhost:5432/broker_cms
      PAYLOAD_SECRET: ci-payload-secret-0123456789abcdef0123456789abcdef
      CMS_API_KEY: ci-api-key
      CMS_PUBLIC_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Живые параметры и контракт новых полей
        run: pnpm test:live-params

      - name: Каталог инструментов платформы (категории, сегменты, поиск, группировка, 5000 элементов)
        run: pnpm test:instrument-catalog

      - name: Юрлицо и лицензии (ссылка на реестр, пустое не выводится, контракт brand)
        run: pnpm test:legal-entity

      - name: Миграции на обжитой базе (языки, фон, портфели тарифов, видео-ссылки, юрлицо; ru/en не меняются)
        run: |
          PGPASSWORD=cms psql -h localhost -U cms -d broker_cms -c "CREATE DATABASE broker_cms_migration"
          pnpm test:migration
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://cms:cms@localhost:5432/broker_cms_migration

      - name: Повторная выкатка (миграции + сид) не меняет правки редактора в ru/en
        run: |
          PGPASSWORD=cms psql -h localhost -U cms -d broker_cms -c "CREATE DATABASE broker_cms_redeploy"
          pnpm test:redeploy
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://cms:cms@localhost:5432/broker_cms_redeploy

      - name: Инструменты платформы (объединение сайтов, version только при изменении, проверки карточки сайта, вебхук)
        run: |
          PGPASSWORD=cms psql -h localhost -U cms -d broker_cms -c "CREATE DATABASE broker_cms_platform"
          pnpm test:platform-instruments
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://cms:cms@localhost:5432/broker_cms_platform

      - name: Видео-ссылки (разбор YouTube/Vimeo, эфир по ссылке, запись и участие вебинара, видео статьи, контракт)
        run: |
          PGPASSWORD=cms psql -h localhost -U cms -d broker_cms -c "CREATE DATABASE broker_cms_video"
          pnpm test:video-links
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://cms:cms@localhost:5432/broker_cms_video

      - name: Статус сервисов (миграция без потерь, проверка/ручной статус, дата и статус инцидента, контракт)
        run: |
          PGPASSWORD=cms psql -h localhost -U cms -d broker_cms -c "CREATE DATABASE broker_cms_status"
          pnpm test:system-status
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://cms:cms@localhost:5432/broker_cms_status

      - name: Статьи (slug и время чтения, миграции Markdown→Lexical, категорий и обучения с повтором и откатом, расписание, предпросмотр, контракт)
        run: |
          PGPASSWORD=cms psql -h localhost -U cms -d broker_cms -c "CREATE DATABASE broker_cms_articles"
          pnpm test:articles
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://cms:cms@localhost:5432/broker_cms_articles

      - name: Обучающий курс (19 статей ru/en на apex-ru, ссылки без utm, повтор не трогает правки, откат только своих)
        run: |
          PGPASSWORD=cms psql -h localhost -U cms -d broker_cms -c "CREATE DATABASE broker_cms_education"
          pnpm test:education-course
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://cms:cms@localhost:5432/broker_cms_education

      - name: Экскурсия по платформе (части и элементы, миграция с откатом, сид ru/en и запасной английский, правки редактора, контракт)
        run: |
          PGPASSWORD=cms psql -h localhost -U cms -d broker_cms -c "CREATE DATABASE broker_cms_onboarding"
          pnpm test:onboarding
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://cms:cms@localhost:5432/broker_cms_onboarding

      - name: Пробные эфиры (удаление у всех сайтов и из версий, повтор, откат без дублей, контракт)
        run: |
          PGPASSWORD=cms psql -h localhost -U cms -d broker_cms -c "CREATE DATABASE broker_cms_mock_streams"
          pnpm test:mock-streams
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://cms:cms@localhost:5432/broker_cms_mock_streams

      - name: Каркас нового сайта (ТД-004 — в транзакции сайта, опубликован, пустой, контракт всех ресурсов, повтор, правки, копия структуры, язык de)
        run: |
          PGPASSWORD=cms psql -h localhost -U cms -d broker_cms -c "CREATE DATABASE broker_cms_skeleton"
          pnpm test:site-skeleton
        env:
          NODE_ENV: production
          DATABASE_URL: postgres://cms:cms@localhost:5432/broker_cms_skeleton

      - name: Seed (dev-режим применяет схему БД + контент из фикстур)
        run: pnpm seed

      - name: Языки сайта, запасной язык, импорт переводов и живого FAQ
        run: pnpm test:i18n

      - name: Повторный сид не стирает ни ru/en, ни de/fr/es (так мигратор работает при каждой выкатке)
        run: pnpm seed

      - name: Build (production)
        run: pnpm build

      - name: Start CMS and wait for health
        run: |
          pnpm start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/v1/health && exit 0
            sleep 2
          done
          echo "CMS did not become healthy" && exit 1

      - name: Contract check (все ресурсы × ru/en против фикстур, de/fr/es против переводов, инструменты платформы)
        run: node scripts/contract-check.mjs
        env:
          CMS_URL: http://localhost:3001
